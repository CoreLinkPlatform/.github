name: Documentation issue
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: URL, file path, or section title
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Problem
      description: Explain what is missing, unclear, or incorrect.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement